name: Automated testing

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  l3build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install TeX Live
        uses: zauguin/install-texlive@v4
        with:
          package_file: .github/tl_packages
      - name: Run l3build check
        id: test-luacjk
        run: l3build check
      - name: Run l3build doc
        if: ${{ !cancelled() && steps.test-luacjk.outcome == 'success' }}
        run: l3build doc
      - name: Get short commit SHA
        if: ${{ !cancelled() && steps.test-luacjk.outcome == 'failure' }}
        run: echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - name: Upload test diffs
        if: ${{ !cancelled() && steps.test-luacjk.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: luacjk-diff-${{ env.SHA_SHORT }}-${{ runner.os }}
          path: |
            build/**/*.diff
            build/**/*.log

  ctex-subset:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install TeX Live
        uses: zauguin/install-texlive@v4
        with:
          package_file: .github/tl_packages
      - name: Unpack LuaCJK
        run: l3build unpack
      - name: Run ctex subset tests
        run: bash scripts/ctex-subset.sh --skip-unpack
        shell: bash
