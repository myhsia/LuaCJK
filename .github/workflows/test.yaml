name: Automated testing

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  l3build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            font-dir: /usr/share/fonts/truetype
            shell: bash
            tl-packages: ""
          - os: macos-latest
            font-dir: /Library/Fonts
            shell: bash
            tl-packages: ""
          - os: windows-latest
            font-dir: /c/Windows/Fonts
            shell: "C:\\msys64\\usr\\bin\\bash.exe -e {0}"
            tl-packages: wintools.windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install TeX Live
        uses: zauguin/install-texlive@v4
        with:
          package_file: .github/tl_packages
          packages: ${{ matrix.tl-packages }}
      - name: Install ctex-kit with the engine option
        shell: bash
        run: |
          # ctex 2.6.6 adds the `engine` option that ctex-engine-luacjk.def and
          # the manual rely on, and TeX Live still ships 2.6.5.  Install the
          # branch carrying the change into TEXMFHOME, which kpathsea searches
          # before texmf-dist.  Delete this step once 2.6.6 is in TeX Live.
          git clone --depth 1 --branch feat/1122-engine-option \
            https://github.com/CTeX-org/ctex-kit.git "$RUNNER_TEMP/ctex-kit"
          cd "$RUNNER_TEMP/ctex-kit/ctex"
          l3build install
      - name: Cache CJK fonts
        id: font-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.font-cache
          key: luacjk-fonts-${{ runner.os }}-${{ hashFiles('.github/font-urls.txt') }}-v1
      - name: Install Noto fonts
        run: |
          # The *.ttc collections the manual's Noto faces live in are not in
          # TeX Live, so they are downloaded, unpacked, kept in a cache keyed
          # by .github/font-urls.txt, and copied into the system font
          # directory; `lxgw-fonts` itself comes from .github/tl_packages.
          FONT_CACHE="${{ github.workspace }}/.font-cache"
          mkdir -p "$FONT_CACHE"
          if [ ! -f "$FONT_CACHE/.done" ]; then
            cd "$FONT_CACHE"
            # One URL per line, # comments and blank lines skipped.  A Windows
            # checkout turns LF into CRLF, so the CR is stripped or curl takes
            # "URL\r" for the file name.
            while IFS= read -r url || [ -n "$url" ]; do
              url="$(printf '%s' "$url" | tr -d '\r')"
              case "$url" in ''|'#'*) continue ;; esac
              curl -LO "$url"
            done < "${{ github.workspace }}/.github/font-urls.txt"
            for f in *OTC.zip; do unzip -ojd . "$f" "*.ttc"; done
            rm -f *.zip
            touch .done
            cd - >/dev/null
          fi
          cp "$FONT_CACHE"/*.ttc "${{ matrix.font-dir }}/"
          fc-cache -f
      - name: Check the guide facts
        shell: bash
        run: bash scripts/check-docs.sh
      - name: Check the CJK range table
        run: texlua scripts/check-charclass.lua
      - name: CHANGELOG.md must be up to date
        shell: bash
        run: |
          l3build changelog
          git add -N -- CHANGELOG.md
          if git diff --exit-code -- CHANGELOG.md; then
            echo "CHANGELOG.md agrees with the \\changes entries"
          else
            echo "::error::CHANGELOG.md is stale: run l3build changelog and commit the result."
            exit 1
          fi
      - name: Run l3build check
        id: test-luacjk
        run: l3build check
      - name: Run l3build doc
        if: ${{ !cancelled() && steps.test-luacjk.outcome == 'success' }}
        shell: bash
        run: |
          # latexmk counts LuaTeX's "unreferenced destination" warning as a
          # broken reference, and it gave up on Windows before converging.
          # latex-lab-testphase-l3doc creates those destinations for the name
          # tables of function environments, so LuaCJK does not produce them.
          # Judge the run by the manual's own criteria (see AGENTS.md) instead
          # of by latexmk's exit code.
          l3build doc ||
            echo "::warning::l3build doc exited with $?; checking the log instead"
          fail=0
          if [ ! -s build/doc/LuaCJK.pdf ]; then
            echo "::error::l3build doc wrote no manual"
            fail=1
          fi
          if [ ! -f build/doc/LuaCJK.log ]; then
            echo "::error::l3build doc wrote no log"
            exit 1
          fi
          for pattern in '^!' '[Rr]eference .* undefined' 'Missing character' \
                         'multiply defined' 'duplicate destination'; do
            if grep -nE "$pattern" build/doc/LuaCJK.log; then
              echo "::error::the manual's log matches: $pattern"
              fail=1
            fi
          done
          exit $fail
      - name: Get short commit SHA
        if: ${{ !cancelled() && steps.test-luacjk.outcome == 'failure' }}
        run: echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - name: Upload test diffs
        if: ${{ !cancelled() && steps.test-luacjk.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: luacjk-diff-${{ env.SHA_SHORT }}-${{ runner.os }}
          path: |
            build/**/*.diff
            build/**/*.fc
            build/**/*.log

  ctex-subset:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install TeX Live
        uses: zauguin/install-texlive@v4
        with:
          package_file: .github/tl_packages
      - name: Install ctex-kit with the engine option
        shell: bash
        run: |
          # See the same step in the l3build job: ctex 2.6.6 has the `engine`
          # option the engine file needs, and TeX Live still ships 2.6.5.
          git clone --depth 1 --branch feat/1122-engine-option \
            https://github.com/CTeX-org/ctex-kit.git "$RUNNER_TEMP/ctex-kit"
          cd "$RUNNER_TEMP/ctex-kit/ctex"
          l3build install
      - name: Unpack LuaCJK
        run: l3build unpack
      - name: Run ctex subset tests
        run: bash scripts/ctex-subset.sh --skip-unpack
        shell: bash
