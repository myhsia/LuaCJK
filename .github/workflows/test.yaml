name: Automated testing

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  l3build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check the guide facts
        run: bash scripts/check-docs.sh
      - name: Install TeX Live
        uses: zauguin/install-texlive@v4
        with:
          package_file: .github/tl_packages
      - name: Check the CJK range table
        run: texlua scripts/check-charclass.lua
      - name: CHANGELOG.md must be up to date
        shell: bash
        run: |
          l3build changelog
          git add -N -- CHANGELOG.md
          if git diff --exit-code -- CHANGELOG.md; then
            echo "CHANGELOG.md agrees with the \\changes entries"
          else
            echo "::error::CHANGELOG.md is stale: run l3build changelog and commit the result."
            exit 1
          fi
      - name: Run l3build check
        id: test-luacjk
        run: l3build check
      - name: Run l3build doc
        if: ${{ !cancelled() && steps.test-luacjk.outcome == 'success' }}
        run: l3build doc
      - name: Get short commit SHA
        if: ${{ !cancelled() && steps.test-luacjk.outcome == 'failure' }}
        run: echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - name: Upload test diffs
        if: ${{ !cancelled() && steps.test-luacjk.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: luacjk-diff-${{ env.SHA_SHORT }}-${{ runner.os }}
          path: |
            build/**/*.diff
            build/**/*.log

  ctex-subset:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install TeX Live
        uses: zauguin/install-texlive@v4
        with:
          package_file: .github/tl_packages
      - name: Unpack LuaCJK
        run: l3build unpack
      - name: Run ctex subset tests
        run: bash scripts/ctex-subset.sh --skip-unpack
        shell: bash
